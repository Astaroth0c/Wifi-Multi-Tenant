# Portal Cativo — nftables (gateway Debian/Kali/Pi)
# Aplicado por provisionar.sh (sed preenche IF_GUEST/IF_WAN/REDE_GUEST)

define IF_GUEST = "eth1"
define IF_WAN = "eth0"
define REDE_GUEST = 192.168.182.0/24
define IP_GUEST = 192.168.182.1
define PORTAL = 3000

table inet portalcativo {

  set autorizados_mac {
    type ether_addr
    flags timeout
  }

  set autorizados_ip {
    type ipv4_addr
    flags timeout
  }

  chain dstnat {
    type nat hook prerouting priority dstnat; policy accept;
    iifname $IF_GUEST ip saddr $REDE_GUEST \
      ether saddr != @autorizados_mac ip saddr != @autorizados_ip \
      tcp dport { 80, 443 } dnat ip to $IP_GUEST:$PORTAL
  }

  chain filtro {
    type filter hook forward priority filter; policy drop;
    iifname $IF_GUEST oifname $IF_WAN \
      ether saddr @autorizados_mac ip saddr @autorizados_ip accept
    iifname $IF_GUEST oifname $IF_WAN drop
    iifname $IF_WAN oifname $IF_GUEST ct state established,related accept
  }

  chain entrada {
    type filter hook input priority filter; policy accept;
    iifname $IF_GUEST udp dport { 53, 67 } accept
    iifname $IF_GUEST tcp dport 53 accept
    iifname $IF_GUEST tcp dport $PORTAL accept
  }

  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname $IF_WAN ip saddr $REDE_GUEST masquerade
  }
}
