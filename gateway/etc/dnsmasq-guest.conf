# dnsmasq — rede guest do Portal Cativo (instalado em /etc/dnsmasq.d/portal-guest.conf)
# interface preenchida por provisionar.sh
interface=eth1
bind-interfaces

dhcp-range=192.168.182.50,192.168.182.250,12h
dhcp-option=option:router,192.168.182.1
dhcp-option=option:dns-server,192.168.182.1

# DNS: responde localmente (com bloqueio adulto) e encaminha o resto
no-resolv
server=1.1.1.1
server=8.8.8.8

# registra as queries para coleta de logs pelo backend
log-queries
log-facility=/var/log/dnsmasq-portal.log

# bloqueio adulto gerado por /usr/share/portal-cativo/bloqueio-adulto.sh
conf-dir=/etc/dnsmasq.d
